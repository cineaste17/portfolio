<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400;500&family=Outfit:wght@200;300;400;600&family=Syne:wght@300;400;700&family=Instrument+Sans:wght@300;400;500&family=Plus+Jakarta+Sans:wght@200;300;400;600&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fff;--fg:#000;
  --mid:#777;--soft:#aaa;--faint:#f7f7f7;--border:#ebebeb;--bdk:#111;
  --font-display:'DM Sans',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'Space Mono',monospace;
  --max-w:760px;
  --page-pad:60px;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

/* ── UTILS ── */
.mono{font-family:var(--font-mono);}
.label{font-family:var(--font-mono);font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:var(--soft);}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:none;opacity:0;transform:translateY(10px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);}
.screen.active{display:flex;opacity:0;transform:translateY(10px);}
.screen.visible{opacity:1;transform:translateY(0);}

/* ════════════════════════════
   LANDING
════════════════════════════ */
#s-landing{background:var(--bg);align-items:center;justify-content:center;cursor:pointer;flex-direction:column;}
.l-word{
  font-family:var(--font-display);font-weight:200;
  font-size:clamp(80px,15vw,200px);
  letter-spacing:-.05em;line-height:.92;
  color:var(--fg);
  opacity:0;transform:translateY(28px);
  animation:rise 1.2s .1s cubic-bezier(.16,1,.3,1) forwards;
  user-select:none;
}
.l-enter{
  margin-top:48px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:.5em;
  color:var(--soft);text-transform:uppercase;
  opacity:0;
  animation:rise .8s .7s cubic-bezier(.16,1,.3,1) forwards, blink 3s 1.8s ease-in-out infinite;
}
@keyframes rise{to{opacity:1;transform:translateY(0);}}
@keyframes blink{0%,100%{color:var(--soft)}50%{color:var(--mid)}}

/* ════════════════════════════
   GLOBAL TOPBAR
════════════════════════════ */
#g-topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:200;
  display:none;align-items:center;justify-content:space-between;
  padding:0 var(--page-pad);
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
#g-topbar.show{display:flex;}
#g-logo{
  font-family:var(--font-display);font-weight:200;font-size:17px;
  letter-spacing:-.03em;cursor:pointer;user-select:none;color:var(--fg);
}
#g-nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:32px;}
#g-nav a{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.3em;
  color:var(--soft);text-transform:uppercase;text-decoration:none;cursor:pointer;
  transition:color .15s;user-select:none;
}
#g-nav a:hover{color:var(--mid);}
#g-nav a.on{color:var(--fg);}
/* ════════════════════════════
   CENTERED PAGE SHELL
   (shared by About, Experience)
════════════════════════════ */
.page-shell{
  position:absolute;inset:0;padding-top:52px;
  overflow-y:auto;
}
.page-shell::-webkit-scrollbar{width:3px;}
.page-shell::-webkit-scrollbar-thumb{background:var(--border);}
.page-center{
  max-width:var(--max-w);margin:0 auto;
  padding:72px var(--page-pad) 120px;
}

/* page title */
.page-h1{
  font-family:var(--font-display);font-weight:200;
  font-size:clamp(32px,5vw,56px);letter-spacing:-.04em;line-height:1;
  color:var(--fg);margin-bottom:72px;
}

/* ════════════════════════════
   ABOUT PAGE
════════════════════════════ */
#s-about{background:var(--bg);flex-direction:column;}
.ab-body{position:absolute;inset:0;padding-top:52px;overflow:hidden;}

.ab-inner{
  height:100%;
  display:grid;
  grid-template-columns:clamp(200px,28%,320px) 1fr;
  max-width:1100px;margin:0 auto;
}

/* photo column：靠左对齐，避免在窄列里居中显得尴尬 */
.ab-photo-col{
  height:100%;display:flex;align-items:center;justify-content:flex-start;
  padding:52px 44px 52px max(24px,calc(var(--page-pad) - 32px));
  border-right:1px solid var(--border);position:relative;
}
.ab-photo-wrap{
  position:relative;
  width:var(--photo-w,240px);height:var(--photo-h,320px);
  min-width:100px;min-height:100px;max-width:480px;max-height:560px;
  overflow:hidden;background:var(--faint);border:1px solid var(--border);
  flex-shrink:0;
}
.ab-photo-inner{position:absolute;inset:0;overflow:hidden;z-index:1;}
.ab-photo-inner img{position:absolute;display:block;left:0;top:0;width:auto;height:auto;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;}
/* text column */
.ab-text-col{
  height:100%;overflow-y:auto;
  padding:64px 56px 64px 52px;
  display:flex;flex-direction:column;justify-content:center;
}
.ab-text-col::-webkit-scrollbar{width:3px;}
.ab-text-col::-webkit-scrollbar-thumb{background:var(--border);}

.ab-field{position:relative;margin-bottom:28px;}
.ab-field:last-child{margin-bottom:0;}
.ab-name{font-family:var(--font-display);font-weight:200;font-size:clamp(36px,4.5vw,64px);letter-spacing:-.04em;line-height:1.0;color:var(--fg);display:block;}
.ab-role{font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;color:var(--mid);text-transform:uppercase;display:block;}
.ab-bio{font-size:14px;line-height:1.95;color:var(--mid);font-weight:300;display:block;max-width:480px;}
.ab-detail-label{font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;color:var(--soft);text-transform:uppercase;margin-bottom:5px;display:block;}
.ab-detail-val{font-size:13px;color:var(--fg);display:block;line-height:1.6;font-weight:300;}
.ab-divider{width:24px;height:1px;background:var(--border);margin:4px 0 24px;}

/* ════════════════════════════
   EXPERIENCE PAGE
════════════════════════════ */
#s-experience{background:var(--bg);flex-direction:column;}
.exp-body{position:absolute;inset:0;padding-top:52px;overflow-y:auto;}
.exp-body::-webkit-scrollbar{width:3px;}
.exp-body::-webkit-scrollbar-thumb{background:var(--border);}
.exp-page{max-width:var(--max-w);margin:0 auto;padding:72px var(--page-pad) 120px;}
.exp-page-title{font-family:var(--font-display);font-weight:200;font-size:clamp(32px,5vw,56px);letter-spacing:-.04em;line-height:1;color:var(--fg);margin-bottom:72px;}

.exp-section{margin-bottom:72px;}
.exp-section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:14px;margin-bottom:0;
  border-bottom:1px solid var(--fg);
}
.exp-section-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.38em;color:var(--fg);text-transform:uppercase;}
.exp-row{
  display:grid;grid-template-columns:148px 1fr;
  padding:36px 0;border-bottom:1px solid var(--border);
  position:relative;gap:0 48px;
}
.exp-row:last-child{border-bottom:none;}

.exp-period{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;color:var(--soft);line-height:1.7;padding-top:3px;}
.exp-row-right{display:flex;flex-direction:column;gap:0;}
.exp-role{font-family:var(--font-display);font-size:16px;font-weight:500;letter-spacing:-.02em;color:var(--fg);line-height:1.2;margin-bottom:5px;}
.exp-org{font-family:var(--font-mono);font-size:9px;letter-spacing:.25em;color:var(--mid);text-transform:uppercase;margin-bottom:12px;}
.exp-desc{font-size:13px;line-height:1.9;color:var(--mid);font-weight:300;max-width:500px;}

/* ════════════════════════════
   PORTFOLIO (WORK)
════════════════════════════ */
#s-portfolio{background:var(--bg);flex-direction:column;}
.pf-layout{position:absolute;inset:0;display:flex;padding-top:52px;}

/* left info panel */
.pf-left{
  width:260px;min-width:260px;height:100%;
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:clamp(48px,22vh,160px) 40px 40px;
  overflow:hidden;
}
.info-num{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;color:var(--soft);margin-bottom:28px;display:flex;align-items:center;gap:10px;}
.info-num::before{content:'';display:block;width:20px;height:1px;background:var(--border);}
.info-cat{font-family:var(--font-mono);font-size:8px;letter-spacing:.38em;color:var(--soft);text-transform:uppercase;margin-bottom:8px;}
.info-title{font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.2;color:var(--fg);margin-bottom:12px;}
.info-desc{font-size:11px;line-height:1.9;color:var(--mid);font-weight:300;margin-bottom:18px;white-space:pre-wrap;}
.info-meta{margin-bottom:18px;}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--faint);}
.meta-k{font-family:var(--font-mono);font-size:8px;letter-spacing:.2em;color:var(--soft);text-transform:uppercase;}
.meta-v{font-family:var(--font-mono);font-size:9px;color:var(--mid);}
.info-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px;}
.tag{font-family:var(--font-mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);border:1px solid var(--border);padding:3px 8px;}
.info-media-strip{display:flex;gap:5px;flex-wrap:wrap;}
.media-thumb{width:40px;height:30px;object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:border-color .2s,opacity .2s;opacity:.45;flex-shrink:0;}
.media-thumb.active{border-color:var(--fg);opacity:1;}
.info-changing{opacity:0;transform:translateY(5px);transition:none!important;}
.info-cat,.info-title,.info-desc,.info-meta,.info-tags,.info-media-strip{transition:opacity .3s,transform .4s cubic-bezier(.16,1,.3,1);}

/* stage */
.pf-stage{flex:1;height:100%;display:flex;align-items:center;justify-content:center;perspective:1200px;overflow:hidden;cursor:ns-resize;position:relative;}
.drum{position:relative;width:100%;height:100%;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center;}
.card{position:absolute;width:min(480px,65vw);height:min(320px,42vw);transition:all .7s cubic-bezier(.16,1,.3,1);cursor:pointer;}
.card-inner{width:100%;height:100%;background:var(--faint);border:1px solid var(--border);position:relative;overflow:hidden;transition:border-color .4s,transform .35s cubic-bezier(.16,1,.3,1);transform-style:preserve-3d;}
.card.active .card-inner{border-color:var(--fg);}
.card.active{cursor:zoom-in;}
.card-media{position:absolute;inset:0;}
.card-slide{position:absolute;inset:0;opacity:0;transition:opacity .5s cubic-bezier(.25,.46,.45,.94);}
.card-slide.visible{opacity:1;}
.card-slide img,.card-slide video{width:100%;height:100%;object-fit:cover;display:block;}
.card-pattern{position:absolute;inset:0;}
.card-progress{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5;}
.cpd{width:3px;height:3px;background:rgba(0,0,0,.15);transition:background .3s;border-radius:50%;}
.cpd.on{background:var(--fg);}
.card-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;z-index:4;background:linear-gradient(to top,rgba(255,255,255,.92) 0%,rgba(255,255,255,0) 50%);}
.card-label{font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;color:var(--mid);text-transform:uppercase;margin-bottom:4px;}
.card-name{font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--fg);line-height:1.2;}
.card-idx{position:absolute;top:14px;right:14px;font-family:var(--font-mono);font-size:8px;color:rgba(0,0,0,.15);z-index:4;}
.card-media-count{position:absolute;top:14px;left:14px;font-family:var(--font-mono);font-size:8px;color:rgba(0,0,0,.2);z-index:4;}
.card-expand-hint{position:absolute;top:14px;left:14px;z-index:6;font-family:var(--font-mono);font-size:8px;letter-spacing:.18em;color:rgba(0,0,0,.45);text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none;}
.card.active:hover .card-expand-hint{opacity:1;}
.scroll-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;color:var(--soft);text-transform:uppercase;animation:blink 3s 1s ease-in-out infinite;pointer-events:none;}

/* right scroll rail */
.pf-right{width:52px;min-width:52px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.scroll-btn{width:52px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--soft);font-size:12px;transition:color .2s;user-select:none;}
.scroll-btn:hover{color:var(--fg);}
.scroll-track{width:1px;height:140px;background:transparent;position:relative;margin:6px 0;}
.scroll-thumb{width:1px;background:var(--fg);position:absolute;left:0;transition:top .5s cubic-bezier(.16,1,.3,1),height .5s cubic-bezier(.16,1,.3,1);}
.pf-dots{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.dot{width:2px;height:2px;background:var(--border);transition:all .3s;cursor:pointer;}
.dot.active{background:var(--fg);height:12px;}

/* ════════════════════════════
   LIGHTBOX
════════════════════════════ */
#lightbox{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0);display:none;align-items:center;justify-content:center;transition:background .3s ease;}
#lightbox.open{display:flex;}
#lightbox.ready{background:rgba(0,0,0,.94);}
.lb-inner{position:relative;max-width:90vw;max-height:88vh;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.95);transition:opacity .3s ease,transform .3s cubic-bezier(.16,1,.3,1);}
#lightbox.ready .lb-inner{opacity:1;transform:scale(1);}
#lbMedia{max-width:90vw;max-height:80vh;object-fit:contain;display:block;}
#lbVideo{max-width:90vw;max-height:80vh;display:block;outline:none;}
.lb-close{position:fixed;top:22px;right:26px;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.4);cursor:pointer;text-transform:uppercase;transition:color .2s;z-index:10;user-select:none;}
.lb-close:hover{color:#fff;}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);font-size:16px;color:rgba(255,255,255,.3);cursor:pointer;transition:color .2s;user-select:none;padding:16px 20px;z-index:10;}
.lb-nav:hover{color:#fff;}
.lb-nav.prev{left:8px;}
.lb-nav.next{right:8px;}
.lb-counter{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;letter-spacing:.25em;color:rgba(255,255,255,.3);pointer-events:none;}
.lb-title{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:8px;letter-spacing:.28em;color:rgba(255,255,255,.25);text-transform:uppercase;pointer-events:none;white-space:nowrap;}

/* ── SMOOTH INTERACTIONS ── */
.scroll-btn{transition:color .15s,transform .09s;}
.scroll-btn:active{transform:scale(.84);}
.dot{transition:background .25s cubic-bezier(.16,1,.3,1),height .3s cubic-bezier(.16,1,.3,1);}
#g-nav a{transition:color .15s,transform .07s;}
#g-nav a:active{transform:scale(.93);}

/* ════════════════════════════
   MOBILE NAV MENU
════════════════════════════ */
#g-hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;cursor:pointer;padding:4px;flex-shrink:0;}
#g-hamburger span{display:block;width:20px;height:1px;background:var(--fg);transition:all .25s cubic-bezier(.16,1,.3,1);}
#g-hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
#g-hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
#g-hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
#g-mobile-nav{
  position:fixed;inset:0;z-index:199;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;
  padding-top:52px;
}
#g-mobile-nav.show{display:flex;}
.g-mobile-link{
  font-family:var(--font-display);font-weight:200;
  font-size:clamp(36px,12vw,56px);letter-spacing:-.04em;
  color:var(--fg);padding:16px 0;cursor:pointer;
  border-bottom:1px solid var(--border);width:72%;text-align:center;
  transition:color .15s;user-select:none;
}
.g-mobile-link:last-child{border-bottom:none;}
.g-mobile-link:active{color:var(--mid);transform:scale(.97);}
.g-mobile-link{transition:color .15s,transform .12s cubic-bezier(.16,1,.3,1);}
/* Work page mobile info bar */
#pf-mobile-bar{
  display:none;
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:12px 20px 16px;
  background:linear-gradient(to top,rgba(255,255,255,1) 60%,rgba(255,255,255,0));
  pointer-events:none;
}
.pmb-num{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;color:var(--soft);margin-bottom:3px;}
.pmb-title{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--fg);line-height:1.2;}
.pmb-cat{font-family:var(--font-mono);font-size:8px;letter-spacing:.3em;color:var(--mid);text-transform:uppercase;margin-top:2px;}

/* ════════════════════════════
   RESPONSIVE — MOBILE
════════════════════════════ */
@media (max-width:700px){
  :root{ --page-pad:22px; }

  /* Topbar */
  #g-topbar{ padding:0 16px; }
  #g-nav{ display:none; }
  #g-hamburger{ display:flex; }

  /* Landing */
  .l-enter{ letter-spacing:.3em; }

  /* ── About ── */
  .ab-body{ overflow-y:auto;-webkit-overflow-scrolling:touch; }
  .ab-inner{
    display:flex;flex-direction:column;
    height:auto;min-height:calc(100vh - 52px);
  }
  .ab-photo-col{
    height:auto;border-right:none;border-bottom:1px solid var(--border);
    padding:40px 24px 36px;justify-content:center;align-items:center;
    flex-shrink:0;
  }
  .ab-photo-wrap{
    max-width:min(200px,52vw)!important;
    max-height:min(266px,69vw)!important;
  }
  .ab-text-col{
    height:auto;padding:36px 24px 100px;
    justify-content:flex-start;flex-shrink:0;
    overflow-y:visible;
  }

  /* ── Work ── */
  .pf-left{ display:none; }
  .pf-right{ display:none; }
  .pf-stage{ cursor:default;touch-action:pan-y; }
  #pf-mobile-bar{ display:block; }
  .card{ width:min(88vw,400px);height:min(59vw,268px); }

  /* ── Experience ── */
  .exp-body{ -webkit-overflow-scrolling:touch; }
  .exp-page{ padding:48px 22px 100px; }
  .exp-page-title{ margin-bottom:48px; }
  .exp-row{ grid-template-columns:1fr;gap:4px 0;padding:28px 0; }
  .exp-period{ padding-top:0;margin-bottom:8px; }

  /* ── Touch targets ── */
  .g-mobile-link{ padding:20px 0; }
  .scroll-btn{ width:44px;height:44px; }

  /* disable glow on touch */
  #cursor-glow{ display:none!important; }
}

/* ════════════════════════════
   CURSOR GLOW
════════════════════════════ */

/* ════════════════════════════
   ABOUT ENTRANCE ANIMATIONS
════════════════════════════ */
.ab-enter-item{
  opacity:0;transform:translateY(18px);
  transition:opacity 1.0s cubic-bezier(.22,1,.36,1),transform 1.0s cubic-bezier(.22,1,.36,1);
}
.ab-enter-item.visible{opacity:1;transform:translateY(0);}

/* ════════════════════════════
   EXPERIENCE ROW ENTRANCE
════════════════════════════ */
.exp-row{
  opacity:0;transform:translateY(18px);
  transition:opacity 1.0s cubic-bezier(.22,1,.36,1),transform 1.0s cubic-bezier(.22,1,.36,1);
}
.exp-row.exp-visible{opacity:1;transform:translateY(0);}

/* ════════════════════════════
   CARD 3D TILT
════════════════════════════ */
.card{
  transform-style:preserve-3d;
  will-change:transform;
}
</style>
</head>
<body>

<div id="g-topbar">
  <div id="g-logo" onclick="goScreen('s-landing')">Portfolio</div>
  <nav id="g-nav">
    <a id="nav-about" onclick="goScreen('s-about')">About</a>
    <a id="nav-work"  onclick="goScreen('s-portfolio')">Work</a>

<script>
/* ══════════════════════════════════
   SCREEN ROUTER
══════════════════════════════════ */
let currentScreen='s-landing';
function goScreen(id){
  if(id===currentScreen)return;
  const prev=document.getElementById(currentScreen);
  const next=document.getElementById(id);
  if(!next)return;
  prev.classList.remove('visible');
  setTimeout(()=>prev.classList.remove('active'),500);
  next.classList.add('active');
  requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.add('visible')));
  currentScreen=id;

  // Global topbar
  const tb=document.getElementById('g-topbar');
  if(id==='s-landing'){
    tb.classList.remove('show');
  } else {
    tb.classList.add('show');
  }
  // Nav active states
  document.getElementById('nav-about').classList.toggle('on', id==='s-about');
  document.getElementById('nav-work').classList.toggle('on',  id==='s-portfolio');
  document.getElementById('nav-exp').classList.toggle('on',   id==='s-experience');
  if(id==='s-portfolio') rebuildAll();
  if(id==='s-about') requestAnimationFrame(()=>layoutAboutPhoto());
  // close mobile nav if open
  if(typeof closeMobileNav==='function') closeMobileNav();
}

/* ── Mobile nav ── */
function toggleMobileNav(){
  const hb=document.getElementById('g-hamburger');
  const mn=document.getElementById('g-mobile-nav');
  const open=hb.classList.toggle('open');
  mn.classList.toggle('show',open);
}
function closeMobileNav(){
  document.getElementById('g-hamburger').classList.remove('open');
  document.getElementById('g-mobile-nav').classList.remove('show');
}
// Init landing
const sl=document.getElementById('s-landing');
sl.classList.add('active');
requestAnimationFrame(()=>requestAnimationFrame(()=>sl.classList.add('visible')));

/* ══════════════════════════════════
   ABOUT PAGE
══════════════════════════════════ */
let abData = {};

function renderAbout(){
  const d=abData;
  setAboutText('abName',d.name);
  setAboutText('abRole',d.role);
  setAboutText('abBio',d.bio);
  setAboutText('abLabel1',d.label1);setAboutText('abVal1',d.val1);
  setAboutText('abLabel2',d.label2);setAboutText('abVal2',d.val2);
  setAboutText('abLabel3',d.label3);setAboutText('abVal3',d.val3);
  const wrap=document.getElementById('abPhotoWrap');
  wrap.style.setProperty('--photo-w',(d.photoW||280)+'px');
  wrap.style.setProperty('--photo-h',(d.photoH||380)+'px');
  wrap.style.width=(d.photoW||280)+'px';
  wrap.style.height=(d.photoH||380)+'px';
  wrap.style.transform=`translateX(${d.frameX||0}px)`;
  const img=document.getElementById('abPhotoImg');
  if(d.photoSrc){
    img.style.display='block';
    const applyLayout=()=>layoutAboutPhoto();
    img.onload=applyLayout;
    img.src=d.photoSrc;
    if(img.complete&&img.naturalWidth)applyLayout();
  } else {
    img.style.display='none';
    img.removeAttribute('src');
  }
}
function setAboutText(id,val){
  const el=document.getElementById(id);
  if(el)el.innerText=val||'';
}
function layoutAboutPhoto(){
  const wrap=document.getElementById('abPhotoWrap');
  const img=document.getElementById('abPhotoImg');
  if(!abData.photoSrc||img.style.display==='none')return;
  const W=wrap.clientWidth,H=wrap.clientHeight;
  if(!W||!H)return;  // screen is hidden — skip to avoid clobbering saved pan with zeros
  const iw=img.naturalWidth,ih=img.naturalHeight;
  if(!iw||!ih)return;
  let z=abData.photoZoom;if(typeof z!=='number'||z<1)z=1;if(z>4)z=4;
  const cover=Math.max(W/iw,H/ih);
  const scale=cover*z;
  const dw=iw*scale,dh=ih*scale;
  let px=typeof abData.photoPanX==='number'?abData.photoPanX:0;
  let py=typeof abData.photoPanY==='number'?abData.photoPanY:0;
  let left=(W-dw)/2+px,top=(H-dh)/2+py;
  /* 宽/高小于相框时也要保留平移（左右或上下留白），不能强行居中否则拖不动 */
  if(dw>=W){left=Math.min(0,Math.max(W-dw,left));}
  else{left=Math.min(W-dw,Math.max(0,left));}
  if(dh>=H){top=Math.min(0,Math.max(H-dh,top));}
  else{top=Math.min(H-dh,Math.max(0,top));}
  img.style.width=dw+'px';
  img.style.height=dh+'px';
  img.style.left=left+'px';
  img.style.top=top+'px';
}

if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(layoutAboutPhoto).observe(document.getElementById('abPhotoWrap'));
}
/* ══════════════════════════════════
   PORTFOLIO
══════════════════════════════════ */
let projects = [];
let current=0,animating=false;
const slideTimers={},slideIdx={};

function pat(type){
  const id='p'+Math.random().toString(36).slice(2,8);
  const s='#e6e6e6',W=500,H=340;
  if(type==='grid')return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;inset:0;width:100%;height:100%"><defs><pattern id="${id}" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="${s}" stroke-width=".8"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#${id})"/></svg>`;
  if(type==='lines'){let l='';for(let i=0;i<16;i++)l+=`<line x1="${i*34}" y1="0" x2="${i*34+180}" y2="${H}" stroke="${s}" stroke-width=".8"/>`;return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;inset:0;width:100%;height:100%">${l}</svg>`;}
  if(type==='dots'){let d='';for(let x=0;x<W;x+=24)for(let y=0;y<H;y+=24)d+=`<circle cx="${x}" cy="${y}" r="1.2" fill="${s}"/>`;return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;inset:0;width:100%;height:100%">${d}</svg>`;}
  if(type==='cross'){let c='';for(let x=0;x<W;x+=36)for(let y=0;y<H;y+=36)c+=`<line x1="${x-6}" y1="${y}" x2="${x+6}" y2="${y}" stroke="${s}" stroke-width=".8"/><line x1="${x}" y1="${y-6}" x2="${x}" y2="${y+6}" stroke="${s}" stroke-width=".8"/>`;return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;inset:0;width:100%;height:100%">${c}</svg>`;}
  if(type==='circles'){let c='';for(let r=16;r<500;r+=28)c+=`<circle cx="${W/2}" cy="${H/2}" r="${r}" fill="none" stroke="${s}" stroke-width=".8"/>`;return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;inset:0;width:100%;height:100%">${c}</svg>`;}
  return'';
}

function buildDrum(){
  Object.keys(slideTimers).forEach(k=>{clearInterval(slideTimers[k]);delete slideTimers[k];});
  const drum=document.getElementById('drum');
  drum.innerHTML='';
  projects.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='card';el.dataset.idx=i;
    const media=p.media||[];
    let slidesHTML='';
    media.forEach((m,mi)=>{
      const vis=mi===0?' visible':'';
      // Reproduce the saved framing with the focal point and zoom.
      const fx = m.focalX !== undefined ? m.focalX : 50;
      const fy = m.focalY !== undefined ? m.focalY : 50;
      const zoom = m.cropZoom || 1;
      // object-position with zoom: shift focal so it stays centered under scale
      // scale via transform on the media element, focal via object-position
      const mediaStyle = `style="object-fit:cover;object-position:${fx}% ${fy}%;transform:scale(${zoom});transform-origin:${fx}% ${fy}%;width:100%;height:100%;"`;
      if(m.type==='video')slidesHTML+=`<div class="card-slide${vis}"><video src="${m.src}" muted loop autoplay playsinline preload="auto" ${mediaStyle}></video></div>`;
      else slidesHTML+=`<div class="card-slide${vis}"><img src="${m.src}" alt="" loading="lazy" ${mediaStyle}></div>`;
    });
    let dotsHTML='';
    if(media.length>1)dotsHTML=`<div class="card-progress">`+media.map((_,mi)=>`<div class="cpd${mi===0?' on':''}"></div>`).join('')+`</div>`;
    el.innerHTML=`<div class="card-inner">
      ${media.length?`<div class="card-media">${slidesHTML}</div>`:`<div class="card-pattern">${pat(p.pattern)}</div>`}
      ${dotsHTML}
      <div class="card-content"><div class="card-label">${p.category||''}</div><div class="card-name">${p.title||''}</div></div>
      ${media.length?`<div class="card-expand-hint">⊕ View</div>`:''}
      <div class="card-idx">${String(i+1).padStart(2,'0')}</div>
      ${media.length>1?`<div class="card-media-count">${media.length} media</div>`:''}
    </div>`;
    el.addEventListener('click',()=>{
      if(i!==current){ goTo(i); return; }
      // active card clicked — open lightbox if has media
      const med=projects[i].media||[];
      if(med.length) openLightbox(i);
    });
    // 3D tilt on hover (applied to inner so it doesn't fight updatePos)
    const inner = el.querySelector('.card-inner');
    el.addEventListener('mousemove', e => {
      if(i !== current) return;
      const r = el.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width  - 0.5;
      const ny = (e.clientY - r.top)  / r.height - 0.5;
      inner.style.transform = `perspective(700px) rotateY(${nx*10}deg) rotateX(${-ny*7}deg) scale(1.025)`;
    });
    el.addEventListener('mouseleave', () => {
      inner.style.transform = '';
    });
    drum.appendChild(el);
    slideIdx[i]=0;
    // start autoplay timer for all multi-media cards
    if(media.length>1) slideTimers[i]=setInterval(()=>advanceSlide(i),2200);
    // attempt video play on all visible slides immediately
    if(media.length){
      const v=el.querySelector('.card-slide.visible video');
      if(v){ v.muted=true; v.play().catch(()=>{}); }
    }
  });
}

function advanceSlide(ci){
  const el=document.querySelector(`.card[data-idx="${ci}"]`);
  if(!el)return;
  const media=projects[ci].media||[];
  if(media.length<2)return;
  const slides=el.querySelectorAll('.card-slide');
  const dots=el.querySelectorAll('.cpd');
  const prev=slideIdx[ci];
  const next=(prev+1)%media.length;
  slideIdx[ci]=next;
  const ov=slides[prev]&&slides[prev].querySelector('video');
  if(ov)ov.pause();
  slides[prev].classList.remove('visible');
  slides[next].classList.add('visible');
  if(dots.length){dots[prev].classList.remove('on');dots[next].classList.add('on');}
  if(ci===current){const nv=slides[next].querySelector('video');if(nv)nv.play().catch(()=>{});}
  if(ci===current)updateMediaStrip();
}

function buildDots(){
  const de=document.getElementById('dots');de.innerHTML='';
  projects.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.addEventListener('click',()=>goTo(i));
    de.appendChild(d);
  });
}

function updatePos(instant){
  const cards=document.querySelectorAll('.card'),n=projects.length;
  if(!n)return;
  cards.forEach((el,i)=>{
    const raw=((i-current)%n+n)%n,rel=raw>n/2?raw-n:raw;
    const abs=Math.abs(rel),sign=rel>0?1:rel<0?-1:0;
    let ty,tz,rx,op,sc,zi;
    if(abs===0){ty=0;tz=0;rx=0;op=1;sc=1;zi=10;}
    else if(abs===1){ty=sign*230;tz=-130;rx=sign*-28;op=.35;sc=.8;zi=5;}
    else if(abs===2){ty=sign*400;tz=-300;rx=sign*-52;op=.12;sc=.64;zi=2;}
    else{ty=sign*500;tz=-420;rx=sign*-65;op=0;sc=.5;zi=0;}
    if(instant)el.style.transition='none';
    else el.style.transition='all .7s cubic-bezier(.16,1,.3,1)';
    el.style.transform=`translateY(${ty}px) translateZ(${tz}px) rotateX(${rx}deg) scale(${sc})`;
    el.style.opacity=op;el.style.zIndex=zi;
    el.classList.toggle('active',abs===0);
    if(instant)requestAnimationFrame(()=>el.style.transition='');
  });
}

function updateMediaStrip(){
  const strip=document.getElementById('infoMediaStrip');strip.innerHTML='';
  const p=projects[current];const media=p.media||[];
  if(!media.length)return;
  const cs=slideIdx[current]||0;
  media.forEach((m,mi)=>{
    if(m.type==='video'){
      const w=document.createElement('div');
      w.style.cssText=`width:44px;height:34px;border:1px solid ${mi===cs?'#000':'var(--border)'};opacity:${mi===cs?1:.5};cursor:pointer;flex-shrink:0;background:var(--faint);display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px;color:var(--mid)`;
      w.textContent='▶';w.addEventListener('click',()=>jumpSlide(current,mi));strip.appendChild(w);
    } else {
      const img=document.createElement('img');
      img.className='media-thumb'+(mi===cs?' active':'');
      img.src=m.src;img.addEventListener('click',()=>jumpSlide(current,mi));strip.appendChild(img);
    }
  });
}

function jumpSlide(ci,ti){
  const el=document.querySelector(`.card[data-idx="${ci}"]`);if(!el)return;
  const slides=el.querySelectorAll('.card-slide');const dots=el.querySelectorAll('.cpd');
  const prev=slideIdx[ci];if(prev===ti)return;
  const ov=slides[prev]&&slides[prev].querySelector('video');if(ov)ov.pause();
  slides[prev].classList.remove('visible');slides[ti].classList.add('visible');
  if(dots.length){dots[prev].classList.remove('on');dots[ti].classList.add('on');}
  slideIdx[ci]=ti;
  const nv=slides[ti].querySelector('video');if(nv&&ci===current)nv.play().catch(()=>{});
  if(slideTimers[ci]){clearInterval(slideTimers[ci]);const m=projects[ci].media||[];if(m.length>1)slideTimers[ci]=setInterval(()=>advanceSlide(ci),1800);}
  updateMediaStrip();
}

function updateInfo(){
  if(!projects.length)return;
  const p=projects[current],n=projects.length;
  const ids=['infoCat','infoTitle','infoDesc','infoMeta','infoTags','infoMediaStrip'];
  ids.forEach(id=>document.getElementById(id).classList.add('info-changing'));
  setTimeout(()=>{
    document.getElementById('infoNum').textContent=`${String(current+1).padStart(3,'0')} / ${String(n).padStart(3,'0')}`;
    document.getElementById('infoCat').textContent=p.category||'';
    document.getElementById('infoTitle').textContent=p.title||'';
    document.getElementById('infoDesc').innerText=p.desc||'';
    document.getElementById('metaYear').textContent=p.year||'—';
    document.getElementById('metaRole').textContent=p.role||'—';
    document.getElementById('infoTags').innerHTML=(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    ids.forEach(id=>document.getElementById(id).classList.remove('info-changing'));
    updateMediaStrip();
    // Mobile bar
    document.getElementById('pmbNum').textContent=String(current+1).padStart(3,'0')+' / '+String(n).padStart(3,'0');
    document.getElementById('pmbTitle').textContent=p.title||'';
    document.getElementById('pmbCat').textContent=p.category||'';
  },180);
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===current));
  const thumb=document.getElementById('thumb'),trackH=160,thumbH=Math.max(20,160/Math.max(projects.length,1));
  thumb.style.height=thumbH+'px';
  thumb.style.top=(projects.length>1?(current/(projects.length-1))*(trackH-thumbH):0)+'px';
  setTimeout(()=>{
    const ac=document.querySelector(`.card[data-idx="${current}"]`);
    if(ac){const v=ac.querySelector('.card-slide.visible video');if(v)v.play().catch(()=>{});}
  },200);
}

function goTo(idx){
  if(animating||!projects.length)return;
  animating=true;
  current=((idx%projects.length)+projects.length)%projects.length;
  updatePos(false);updateInfo();
  setTimeout(()=>animating=false,700);
}

function rebuildAll(){
  if(current>=projects.length)current=Math.max(0,projects.length-1);
  buildDrum();buildDots();updatePos(true);updateInfo();
}

// Wheel — locked after each step, prevents over-scroll
let wAcc=0,wT,wLocked=false;
document.getElementById('stage').addEventListener('wheel',e=>{
  e.preventDefault();
  if(wLocked)return;
  wAcc+=e.deltaY;
  clearTimeout(wT);
  if(Math.abs(wAcc)>55){
    wLocked=true;
    goTo(current+(wAcc>0?1:-1));
    wAcc=0;
    setTimeout(()=>{wLocked=false;},680);
  } else {
    wT=setTimeout(()=>{wAcc=0;},160);
  }
},{passive:false});
document.getElementById('arrowUp').addEventListener('click',()=>goTo(current-1));
document.getElementById('arrowDown').addEventListener('click',()=>goTo(current+1));
// Touch — velocity-aware swipe
let tY=0,tT=0;
document.getElementById('stage').addEventListener('touchstart',e=>{tY=e.touches[0].clientY;tT=Date.now();},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{
  const d=tY-e.changedTouches[0].clientY;
  const vel=Math.abs(d)/(Date.now()-tT||1);
  if(Math.abs(d)>36||vel>0.28)goTo(current+(d>0?1:-1));
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('lightbox').classList.contains('open'))return;
  if(currentScreen!=='s-portfolio')return;
  if(e.key==='ArrowUp'||e.key==='ArrowLeft')goTo(current-1);
  if(e.key==='ArrowDown'||e.key==='ArrowRight')goTo(current+1);
});

/* ── LIGHTBOX ── */
let lbPI=0,lbSI=0;
function openLightbox(pi){
  const p=projects[pi];const media=p.media||[];if(!media.length)return;
  lbPI=pi;lbSI=slideIdx[pi]||0;
  // renderLbSlide (including vid.play) must run synchronously within the user gesture
  renderLbSlide();
  const lb=document.getElementById('lightbox');lb.style.display='flex';
  requestAnimationFrame(()=>{lb.classList.add('open');requestAnimationFrame(()=>lb.classList.add('ready'));});
}
function closeLightbox(){
  const lb=document.getElementById('lightbox');lb.classList.remove('ready');
  setTimeout(()=>{lb.classList.remove('open');lb.style.display='none';stopLbVid();},320);
}
function stopLbVid(){const v=document.getElementById('lbVideo');v.pause();v.src='';}
function renderLbSlide(){
  const p=projects[lbPI];const media=p.media||[];if(!media.length)return;
  const m=media[lbSI];const img=document.getElementById('lbMedia');const vid=document.getElementById('lbVideo');
  stopLbVid();
  if(m.type==='video'){
    img.style.display='none';vid.style.display='block';
    vid.muted=false;vid.volume=1;
    vid.src=m.src;
    // play() called synchronously so browser keeps user-gesture context for audio
    vid.play().catch(()=>{});
  } else {
    vid.style.display='none';img.style.display='block';img.src=m.src;
  }
  document.getElementById('lbTitle').textContent=p.title||'';
  document.getElementById('lbCounter').textContent=`${String(lbSI+1).padStart(2,'0')} / ${String(media.length).padStart(2,'0')}`;
  document.getElementById('lbPrev').style.opacity=media.length>1?'1':'0';
  document.getElementById('lbNext').style.opacity=media.length>1?'1':'0';
}
function lbGo(dir){
  const media=projects[lbPI].media||[];lbSI=((lbSI+dir)+media.length)%media.length;
  const inner=document.getElementById('lbInner');inner.style.transition='none';inner.style.opacity='0';inner.style.transform='scale(.96)';
  setTimeout(()=>{renderLbSlide();inner.style.transition='opacity .25s ease,transform .3s cubic-bezier(.16,1,.3,1)';inner.style.opacity='1';inner.style.transform='scale(1)';},160);
}
document.getElementById('lbClose').addEventListener('click',closeLightbox);
document.getElementById('lbPrev').addEventListener('click',()=>lbGo(-1));
document.getElementById('lbNext').addEventListener('click',()=>lbGo(1));
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))closeLightbox();});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  if(e.key==='ArrowLeft')lbGo(-1);
  if(e.key==='ArrowRight')lbGo(1);
});
// Lightbox swipe — touch screen + trackpad drag + trackpad two-finger horizontal scroll
{
  const lb=document.getElementById('lightbox');
  const lbHasMulti=()=>(projects[lbPI]&&projects[lbPI].media||[]).length>1;

  // Touch (real touchscreen) — handles mobile swipe
  let lbTX=0,lbTY=0,lbTT=0,lbTActive=false;
  lb.addEventListener('touchstart',e=>{
    lbTX=e.touches[0].clientX;lbTY=e.touches[0].clientY;lbTT=Date.now();lbTActive=true;
  },{passive:true});
  lb.addEventListener('touchend',e=>{
    if(!lbTActive)return;
    lbTActive=false;
    if(!lbHasMulti())return;
    const dx=lbTX-e.changedTouches[0].clientX;
    const dy=lbTY-e.changedTouches[0].clientY;
    const vel=Math.abs(dx)/(Date.now()-lbTT||1);
    // Only horizontal swipe (dx dominates dy)
    if(Math.abs(dx)>Math.abs(dy)&&(Math.abs(dx)>30||vel>0.2)) lbGo(dx>0?1:-1);
  },{passive:true});
  lb.addEventListener('touchcancel',()=>{lbTActive=false;},{passive:true});

  // Pointer drag (mouse or trackpad click-drag) — skip on touch devices
  let lbPX=0,lbPDown=false,lbPMoved=false;
  lb.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch')return;  // handled by touch events above
    if(e.target===document.getElementById('lbClose'))return;
    if(e.target===document.getElementById('lbPrev'))return;
    if(e.target===document.getElementById('lbNext'))return;
    lbPX=e.clientX;lbPDown=true;lbPMoved=false;
  });
  lb.addEventListener('pointermove',e=>{
    if(!lbPDown)return;
    if(Math.abs(e.clientX-lbPX)>8)lbPMoved=true;
  });
  lb.addEventListener('pointerup',e=>{
    if(!lbPDown)return;
    lbPDown=false;
    const dx=lbPX-e.clientX;
    if(lbPMoved&&Math.abs(dx)>40&&lbHasMulti()) lbGo(dx>0?1:-1);
    lbPMoved=false;
  });
  lb.addEventListener('pointercancel',()=>{lbPDown=false;});

  // Trackpad two-finger horizontal swipe (wheel deltaX)
  let lbWLocked=false,lbWAcc=0;
  lb.addEventListener('wheel',e=>{
    e.preventDefault();
    if(!lbHasMulti())return;
    if(lbWLocked)return;
    lbWAcc+=e.deltaX;
    if(Math.abs(lbWAcc)>60){
      lbWLocked=true;
      lbGo(lbWAcc>0?1:-1);
      lbWAcc=0;
      setTimeout(()=>{lbWLocked=false;},600);
    }
  },{passive:false});
}

let expData = {};

function renderExp() {
  renderExpSection('internships', 'exp-intern-list');
  renderExpSection('campus', 'exp-campus-list');
  renderExpSection('exchange', 'exp-exchange-list');
}

function renderExpSection(key, listId) {
  const list = document.getElementById(listId);
  if(!list) return;
  list.innerHTML = '';
  if(!expData[key]) return;
  expData[key].forEach(item => {
    const row = document.createElement('div');
    row.className = 'exp-row';
    row.innerHTML = `
      <div class="exp-row-left">
        <div class="exp-period"></div>
      </div>
      <div class="exp-row-right">
        <div class="exp-role"></div>
        <div class="exp-org"></div>
        <div class="exp-desc"></div>
      </div>
    `;
    row.querySelector('.exp-period').innerText = item.period || '';
    row.querySelector('.exp-role').innerText = item.role || '';
    row.querySelector('.exp-org').innerText = item.org || '';
    row.querySelector('.exp-desc').innerText = item.desc || '';
    list.appendChild(row);
  });
}

// ── 2. Magnetic nav links ──
document.querySelectorAll('#g-nav a').forEach(link => {
  link.addEventListener('mousemove', e => {
    const r = link.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = (e.clientX - cx) * 0.32, dy = (e.clientY - cy) * 0.32;
    link.style.transform = `translate(${dx}px,${dy}px)`;
  });
  link.addEventListener('mouseleave', () => {
    link.style.transform = '';
  });
});

// ── 3. About entrance animation ──
let _abEntranceDone = false;
function triggerAboutEntrance() {
  if(_abEntranceDone) return; // only animate once
  _abEntranceDone = true;
  const items = document.querySelectorAll('.ab-enter-item');
  items.forEach(el => { el.classList.remove('visible'); el.style.transition='none'; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    items.forEach((el, i) => {
      el.style.transition = '';
      setTimeout(() => el.classList.add('visible'), i * 110);
    });
  }));
}

// ── 4. Experience row entrance (IntersectionObserver) ──
function observeExpRows() {
  const rows = document.querySelectorAll('.exp-row');
  if(!rows.length) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((entry, _) => {
      if(entry.isIntersecting) {
        const allRows = document.querySelectorAll('.exp-row');
        let delay = 0;
        allRows.forEach((row, i) => {
          if(row === entry.target) delay = i * 120;
        });
        setTimeout(() => entry.target.classList.add('exp-visible'), delay);
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });
  rows.forEach(row => obs.observe(row));
}

// ── 5. Work stage horizontal drag ──
{
  const stageEl = document.getElementById('stage');
  let dragX = 0, dragStarted = false, dragMoved = false;
  stageEl.addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch') return; // handled by touchend
    dragX = e.clientX; dragStarted = true; dragMoved = false;
  });
  stageEl.addEventListener('pointermove', e => {
    if(!dragStarted) return;
    if(Math.abs(e.clientX - dragX) > 6) dragMoved = true;
  });
  stageEl.addEventListener('pointerup', e => {
    if(!dragStarted) return;
    dragStarted = false;
    const diff = e.clientX - dragX;
    if(dragMoved && Math.abs(diff) > 38) goTo(current + (diff < 0 ? 1 : -1));
    dragMoved = false;
  });
  stageEl.addEventListener('pointercancel', () => { dragStarted = false; });
}

// ── Hook goScreen for entrance animations ──
const _gsOrig = goScreen;
goScreen = function(id) {
  _gsOrig(id);
  if(id === 's-about') {
    setTimeout(triggerAboutEntrance, 300);
  }
  if(id === 's-experience') {
    setTimeout(observeExpRows, 350);
  }
};

const fonts = {
  dm: {family:"'DM Sans', sans-serif", weight:'200'},
  outfit: {family:"'Outfit', sans-serif", weight:'200'},
  syne: {family:"'Syne', sans-serif", weight:'300'},
  jakarta: {family:"'Plus Jakarta Sans', sans-serif", weight:'200'},
  instrument: {family:"'Instrument Sans', sans-serif", weight:'300'},
  grotesk: {family:"'Space Grotesk', sans-serif", weight:'300'},
  cormorant: {family:"'Cormorant Garamond', serif", weight:'300'},
};

async function loadPortfolio() {
  const response = await fetch('./data.json', {cache:'no-cache'});
  if(!response.ok) throw new Error('Portfolio data request failed: ' + response.status);
  const data = await response.json();
  abData = JSON.parse(data.pf_about_v1 || '{}');
  projects = JSON.parse(data.pf_v3 || '[]');
  expData = JSON.parse(data.pf_exp_v1 || '{}');

  const fontId = data.pf_font_v1;
  const font = Object.hasOwn(fonts, fontId) ? fonts[fontId] : fonts.dm;
  const root = document.documentElement;
  root.style.setProperty('--font-display', font.family);
  root.style.setProperty('--font-body', font.family);
  const landingWord = document.querySelector('.l-word');
  landingWord.style.fontStyle = fontId === 'cormorant' ? 'italic' : 'normal';
  landingWord.style.fontWeight = font.weight;
  landingWord.style.letterSpacing = fontId === 'cormorant' ? '.05em' : '-.04em';

  renderAbout();
  renderExp();
}

const portfolioReady = loadPortfolio().then(() => true, error => {
  console.error(error);
  document.querySelector('.l-enter').textContent = 'Unable to load portfolio. Please refresh.';
  return false;
});
document.getElementById('s-landing').addEventListener('click', async () => {
  if(await portfolioReady) goScreen('s-about');
});
